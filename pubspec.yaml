name: jobfilter
description: >
  JobFilter — a driver assistant that automatically evaluates incoming taxi/private-hire
  jobs against driver-defined rules (£ per mile, pickup distance, hourly rate, etc.)
  and, where the operating system legitimately permits it, accepts or rejects them.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local, on-device persistence (no cloud sync — see docs/architecture.md)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Value objects / formatting
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  crypto: ^3.0.3

  # Android/iOS permission status surfacing (never used to silently grant permissions)
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.2

  # OCR fallback only — see docs/android-automation.md section on ScreenTextProvider priority
  google_mlkit_text_recognition: ^0.13.1

  cupertino_icons: ^1.0.8

  # Statistics screen charts
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  image: ^4.2.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

# Driver-supplied artwork, pre-composited by tool/generate_icons.dart onto
# properly padded/backgrounded square canvases (the source photo wasn't
# square, centered, or safe-zone padded for either target as supplied).
flutter_launcher_icons:
  android: true
  image_path: "assets/icons/app_icon_legacy.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21
